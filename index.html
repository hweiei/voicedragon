    <canvas id="ambient-canvas" class="ambient-canvas" aria-hidden="true"></canvas>

      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
      <div id="modal-root" class="modal-root" aria-live="assertive"></div>
