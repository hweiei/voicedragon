# Cloudflare Pages 部署（方案 §13 决策 1：Cloudflare Pages）。
# 手动触发（workflow_dispatch）；配置好仓库 secrets 后可改为 push 自动部署：
#   1) Cloudflare Dashboard → Workers & Pages → Create → Pages → 上传 dist 首次建项目（项目名 voicedragon）
#   2) My Profile → API Tokens → Create Token → 模板 "Cloudflare Pages — Edit"
#   3) 仓库 Settings → Secrets and variables → Actions 添加：
#      CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
#   4) 把下方 on: 的 push: branches: [main] 取消注释即可自动部署
name: deploy-pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=voicedragon
