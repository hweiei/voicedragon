name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npx biome ci .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit & contract tests
        run: npx vitest run

      - name: Build (PWA)
        run: npm run build

      - name: Performance budget (first-bundle JS gzip)
        run: npx vite-node scripts/perf-budget.ts

      - name: Release artifact contract (PWA shell, paths, headers)
        run: npx vite-node scripts/release-readiness.ts

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-matrix-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser matrix
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build & run Chromium E2E (title → map → battle → QTE cast → save resume)
        run: npm run test:e2e
      - name: Cross-browser release matrix (desktop, touch, offline, invalid archives)
        run: npm run test:release
      - name: Lighthouse mobile + desktop budgets
        run: npm run test:lighthouse
