# Publish only an explicitly requested run or a successful main-branch CI result.
# One-time administrator setup: Settings -> Pages -> Source = GitHub Actions.
name: pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure Pages (requires one-time repository administrator setup)
        uses: actions/configure-pages@v5
      - name: Build under the GitHub Pages project path
        run: npx vite build --base=/voicedragon/
      - name: Verify app, audio cache and project-path artifacts
        run: npx vite-node scripts/release-readiness.ts --base=/voicedragon/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
